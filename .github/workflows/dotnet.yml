name: .NET CI/CD Pipeline

# ⚠️ Not (11.14 denetimi): entegrasyon testleri **Testcontainers** kullanıyor, yani
# Postgres/Redis'i kendileri ayağa kaldırıyor (bkz. CustomWebApplicationFactory).
# Aşağıdaki `services:` blokları ve "Apply Migrations" adımı bu yüzden **artık
# gereksiz** — çalışan bir hattı doğrulayamadan değiştirmemek için bilinçli olarak
# bırakıldı. İlk yeşil koşudan sonra kaldırılabilir (koşu süresini kısaltır).

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kadirliapp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore KadirliApp.sln

    - name: Build
      run: dotnet build KadirliApp.sln -c Release --no-restore

    - name: Setup ef tools
      run: dotnet tool install --global dotnet-ef

    - name: Apply Migrations for Test Database
      env:
        ConnectionStrings__Postgres: Host=localhost;Port=5432;Database=kadirliapp_test;Username=postgres;Password=postgres;Include Error Detail=true;Maximum Pool Size=100;Minimum Pool Size=10
      run: dotnet ef database update -p KadirliApp.Infrastructure -s KadirliApp.Api

    - name: Test
      env:
        ConnectionStrings__Postgres: Host=localhost;Port=5432;Database=kadirliapp_test;Username=postgres;Password=postgres
        ConnectionStrings__Redis: localhost:6379
        Otp__DevMode: true
      run: dotnet test KadirliApp.Tests -c Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: '**/TestResults/**/coverage.cobertura.xml'
