name: .NET CI

# 🔑 Faz 12.21b — dosya adı artık YAPTIĞI İŞİ söylüyor.
# Adı 12.21'e kadar "CI/CD Pipeline"dı ama içinde tek bir deploy adımı yoktu; bu,
# §7 madde 37'nin ("panelin en sinsi yalan biçimi") CI karşılığıydı. Teslim ayrı bir
# iş akışına alındı: `.github/workflows/release.yml` (imaj yayınlama).
#
# 🧹 Faz 12.21b temizliği (11.14 denetiminin BIRAKTIĞI borç kapatıldı): entegrasyon
# testleri **Testcontainers** kullanıyor — Postgres/Redis'i kendileri ayağa kaldırıyor
# (bkz. CustomWebApplicationFactory). Bu yüzden `services:` blokları, `dotnet-ef`
# global kurulumu ve "Apply Migrations for Test Database" adımı **hiçbir işe
# yaramıyordu**: her koşu iki gereksiz konteyner kaldırıp hiç kullanılmayan bir
# veritabanına migration uyguluyordu. Dosyanın kendi yorumu bunu zaten söylüyordu
# ("ilk yeşil koşudan sonra kaldırılabilir") — o koşu çoktan yeşile döndü.

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # ── Faz 12.9 — panel varlıklarının SÜRÜKLENME (drift) kapısı ──────────────
    #
    # 🔴 Neden gerekli: wwwroot/css/panel.css TÜRETİLMİŞ ama COMMİT EDİLMİŞ bir
    # dosya (depoyu klonlayan biri npm kurmadan paneli açabilmeli). Commit edilmiş
    # türetilmiş dosyanın bilinen çürüme biçimi şudur: biri bir görünüme yeni bir
    # Tailwind sınıfı yazar, `npm run build:css` çalıştırmayı unutur ve o sınıf
    # üretilen CSS'te YOKTUR. Sonuç bu projenin en sevmediği sınıftan:
    # derleme geçer, testler yeşil kalır, panel açılır — yalnız o öğe stilsizdir.
    #
    # Kapı, CSS'i yeniden üretip `git diff` ile karşılaştırır: fark varsa kırmızı.
    # Geliştirici makinesinde npm ZORUNLU DEĞİL; doğrulama burada yapılır.
    - name: Setup Node (panel varlıkları)
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Panel varlıklarını yeniden üret
      working-directory: KadirliApp.Web
      run: npm ci && npm run build

    - name: Türetilmiş varlıklar güncel mi
      run: |
        if ! git diff --quiet -- KadirliApp.Web/wwwroot; then
          echo '::error::Panel varlıkları güncel değil. "cd KadirliApp.Web && npm run build" çalıştırıp çıktıyı commit edin.'
          git diff --stat -- KadirliApp.Web/wwwroot
          exit 1
        fi
        echo "✓ wwwroot türetilmiş varlıkları kaynakla uyumlu"

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore KadirliApp.sln

    - name: Build
      run: dotnet build KadirliApp.sln -c Release --no-restore

    # ⚠️ Bağlantı dizesi ORTAM DEĞİŞKENİ olarak VERİLMEZ: Testcontainers her koşuda
    # kendi Postgres/Redis'ini kaldırıp bağlantı dizesini kendisi enjekte ediyor.
    # Elle bir dize vermek, testlerin gerçekte hangi veritabanına baktığını belirsiz
    # yapardı — 12.21b'ye kadar tam olarak bu belirsizlik vardı.
    - name: Test
      env:
        Otp__DevMode: true
      run: dotnet test KadirliApp.Tests -c Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

    # 🔴 Faz 12.21a — üretim imajları CI'da DERLENİR.
    # Sebep: `Dockerfile` derlenmeden fark edilmeyen bir hata sınıfı var ve bu projede
    # zaten bir örneği yaşandı — `aspnet:8.0` imajında `curl` YOK, yani HEALTHCHECK
    # komutu çalışmıyor ve konteyner uygulama gayet iyi koşarken "unhealthy" damgası
    # yiyor. Böyle bir hata ilk kez DAĞITIM sırasında görünürdü.
    # ⚠️ İmaj yalnız derlenir, yayınlanmaz: yayınlama `release.yml`'in işi.
    - name: Üretim imajları derleniyor mu
      run: |
        docker build -f KadirliApp.Api/Dockerfile -t kadirliapp-api:ci .
        docker build -f KadirliApp.Web/Dockerfile -t kadirliapp-web:ci .

    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: '**/TestResults/**/coverage.cobertura.xml'
