name: kadirli_app
description: "Kadirli şehir uygulaması"
publish_to: 'none'

# version: <sürüm>+<build>. Store yayınında (Faz 11.15) build numarası artırılır.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations: # Türkçe Material metinleri / tarih biçimleri
    sdk: flutter

  cupertino_icons: ^1.0.8

  # --- Durum yönetimi (Faz 11 teknoloji kararı) ---
  flutter_riverpod: ^3.0.3

  # --- Yönlendirme ---
  go_router: ^17.2.1

  # --- Ağ (11.2'de yapılandırılır) ---
  dio: ^5.9.0

  # --- Model / JSON (11.2'de kullanılmaya başlanır) ---
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # --- Depolama ---
  flutter_secure_storage: ^9.2.4 # token'lar (11.2)
  shared_preferences: ^2.5.3 # tema tercihi vb.

  # --- Görsel ---
  cached_network_image: ^3.4.1
  image_picker: ^1.2.0

  # --- Yardımcılar ---
  intl: ^0.20.2 # Türkçe tarih/sayı biçimleme
  url_launcher: ^6.3.2 # telefon / WhatsApp / harita
  package_info_plus: ^9.0.1 # Ayarlar > Hakkında: sürüm/build (11.5)
  share_plus: ^12.0.2

  # --- Push bildirimleri (11.13) ---
  # ⚠️ Firebase yapılandırma dosyaları (android/app/google-services.json,
  # ios/Runner/GoogleService-Info.plist) .gitignore'da — depoda YOKLAR.
  # Uygulama bu dosyalar olmadan da AÇILIR: `Firebase.initializeApp()` hatası
  # yakalanıp push devre dışı bırakılır (backend'deki `Fcm:Provider=None`
  # no-op kararının istemci aynası). Bkz. `core/push/push_messaging.dart`.
  firebase_core: ^4.2.1
  firebase_messaging: ^16.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # --- Kod üretimi (11.2'den itibaren) ---
  build_runner: ^2.9.0
  freezed: ^3.2.4
  json_serializable: ^6.11.1

  # --- Yayın görselleri (Faz 11.16) ---
  # Kaynak görseller `assets/branding/` altında ve `tool/generate_branding.py`
  # ile ÜRETİLİYOR; bu iki paket yalnız platform boyutlarını türetir.
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

# ── Uygulama ikonu (Faz 11.16) ───────────────────────────────────────────────
# Üretmek için: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/icon.png
  # Android adaptive: ön plan + düz marka rengi zemin. Sistem maskeyi kendi
  # uyguladığı için ön plan görselinin içeriği güvenli alanda duruyor.
  adaptive_icon_background: "#2C7A57"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  # ⚠️ iOS ikonları ALFA KANALI KABUL ETMEZ — saydamlık içeren ikon App Store
  # yüklemesinde reddedilir. Kaynak zaten RGB ama emniyet için açık bırakıldı.
  remove_alpha_ios: true

# ── Açılış ekranı (Faz 11.16) ────────────────────────────────────────────────
# Üretmek için: dart run flutter_native_splash:create
# Renkler MOBILE_UX_PLAN token'ları: açık bg #FAF9F6, koyu bg #121815.
flutter_native_splash:
  color: "#FAF9F6"
  color_dark: "#121815"
  image: assets/branding/splash.png
  image_dark: assets/branding/splash_dark.png
  android_12:
    color: "#FAF9F6"
    color_dark: "#121815"
    # ⚠️ Android 12+ logoyu DAİRESEL maskeye oturtur: 1152 px tuvalde güvenli
    # alan yalnız ortadaki 768 px çaplı daire. Normal splash görseli
    # kullanıldığında filiz maskenin dışında kalıp kesiliyordu — ayrı görsel.
    image: assets/branding/splash_android12.png
    image_dark: assets/branding/splash_android12_dark.png

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/branding/

  fonts:
    # Nunito (SIL OFL 1.1 — lisans: assets/fonts/OFL.txt).
    # Yalnız 3 ağırlık: gövde 400, başlık 600, vurgu 700 (MOBILE_UX_PLAN §2).
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
